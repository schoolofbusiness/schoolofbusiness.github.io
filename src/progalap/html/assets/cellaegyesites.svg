<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" role="img"><title>Colspan és rowspan összevetése</title><rect width="1000" height="340" rx="20" fill="#f8fafc"/><style>text{font-family:Arial,sans-serif;fill:#183153;font-size:21px}.code{font-family:monospace;font-size:29px}.small{font-size:17px}</style><text font-family="Arial, sans-serif" fill="#183153" font-size="21" x="35" y="42" class="">Cellaegyesítés: mindig a foglalt helyeket számold!</text><text font-family="Arial, sans-serif" fill="#183153" font-size="21" x="70" y="95" class="">colspan=&quot;2&quot;</text><text font-family="Arial, sans-serif" fill="#183153" font-size="21" x="570" y="95" class="">rowspan=&quot;2&quot;</text><rect x="70" y="125" width="350" height="60" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text font-family="Arial, sans-serif" fill="#183153" font-size="21" x="245.0" y="162.0" text-anchor="middle">Két oszlop széles</text><rect x="70" y="185" width="175" height="60" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text font-family="Arial, sans-serif" fill="#183153" font-size="21" x="157.5" y="222.0" text-anchor="middle">Adat</text><rect x="245" y="185" width="175" height="60" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text font-family="Arial, sans-serif" fill="#183153" font-size="21" x="332.5" y="222.0" text-anchor="middle">Adat</text><rect x="570" y="125" width="175" height="120" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text font-family="Arial, sans-serif" fill="#183153" font-size="21" x="657.5" y="192.0" text-anchor="middle">Két sor</text><rect x="745" y="125" width="175" height="60" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text font-family="Arial, sans-serif" fill="#183153" font-size="21" x="832.5" y="162.0" text-anchor="middle">Adat</text><rect x="745" y="185" width="175" height="60" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text font-family="Arial, sans-serif" fill="#183153" font-size="21" x="832.5" y="222.0" text-anchor="middle">Adat</text><text font-family="Arial, sans-serif" fill="#183153" font-size="21" x="70" y="300" class="small" style="font-size:17px">Egy cella, két oszlophely.</text><text font-family="Arial, sans-serif" fill="#183153" font-size="21" x="570" y="300" class="small" style="font-size:17px">A második sorban itt nincs új cella.</text></svg>